version: '3.8'

services:
  # MySQL 설정
  fast-pick-db:
    image: mysql:8.0
    container_name: fast-pick-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: fastpick
      MYSQL_ROOT_PASSWORD: 1111
    volumes:
      - ./db/data:/var/lib/mysql

  fast-pick-redis:
    image: redis:latest
    container_name: fast-pick-redis
    ports:
      - "6380:6379"