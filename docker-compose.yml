

services:
  # MySQL 설정
  fast-pick-db:
    image: mysql:8.0
    container_name: fast-pick-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: fastpick
      MYSQL_ROOT_PASSWORD: 1111
    volumes:
      - ./db/data:/var/lib/mysql

  fast-pick-redis:
    image: redis:latest
    container_name: fast-pick-redis
    ports:
      - "6380:6379"

  fast-pick-kafka:
    image: apache/kafka:3.7.2 # 🌟 Bitnami 대신 안전한 공식 아파치 최신버전으로 변경!
    container_name: fast-pick-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "fastpick-cluster-1" # 🌟 아파치 공식 이미지는 클러스터 ID가 필수입니다